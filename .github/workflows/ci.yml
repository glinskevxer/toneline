name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: test on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.2
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  audit:
    name: audit runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.2
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  worked-example:
    name: run the worked desk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.2
          cache: npm
      - run: npm ci --omit=dev
      - name: validate
        run: node bin/toneline.js validate -c examples/cross-timbers.json --strict
      - name: screen
        run: node bin/toneline.js screen -c examples/cross-timbers.json -f examples/march-2024.feed
      - name: respond
        run: |
          node bin/toneline.js respond \
            -c examples/cross-timbers.json \
            -f examples/march-2024.feed \
            -a 2024-03-14T08:00 -b ci -o /tmp/postings.json
      - name: queue
        run: |
          node bin/toneline.js queue -c examples/cross-timbers.json \
            -f examples/march-2024.feed -a 2024-03-15T09:00
      - name: age
        run: |
          node bin/toneline.js age -c examples/cross-timbers.json \
            -f examples/march-2024.feed -a 2024-03-15T09:00
      - name: brief
        run: |
          node bin/toneline.js brief -c examples/cross-timbers.json \
            -f examples/march-2024.feed -a 2024-03-15T09:00
      - name: register
        run: |
          node bin/toneline.js register -c examples/cross-timbers.json \
            -f examples/march-2024.feed -a 2024-03-14T08:00 -o /tmp/register.csv
      - name: invoice
        run: |
          node bin/toneline.js invoice -c examples/cross-timbers.json \
            -f examples/march-2024.feed -p 2024-03 -a 2024-03-14T08:00
      - name: damage
        run: node bin/toneline.js damage -d examples/damages-2024.csv -f examples/march-2024.feed
      - name: coverage
        run: |
          node bin/toneline.js coverage -c examples/cross-timbers.json \
            -f examples/march-2024.feed --quality
      - name: exceptions
        run: |
          node bin/toneline.js exceptions -c examples/cross-timbers.json \
            -f examples/march-2024.feed -a 2024-03-15T09:00
      - name: capacity
        run: |
          node bin/toneline.js capacity -c examples/cross-timbers.json \
            -f examples/march-2024.feed -r examples/roster.json -a 2024-03-15T09:00
      - name: find
        run: |
          node bin/toneline.js find -c examples/cross-timbers.json \
            -f examples/march-2024.feed -s "nw 23rd" --explain
      - name: month
        run: |
          node bin/toneline.js month -c examples/cross-timbers.json \
            -f examples/march-2024.feed -p 2024-03 -a 2024-03-20T08:00 \
            -d examples/damages-2024.csv
      - name: map
        run: |
          node bin/toneline.js map -c examples/cross-timbers.json \
            -f examples/march-2024.feed -o /tmp/desk.geojson
      - name: book
        run: |
          node bin/toneline.js book -c examples/cross-timbers.json \
            -f examples/march-2024.feed -j /tmp/journal.json \
            -a 2024-03-14T08:00 -b ci
      - name: the journal seals the same way twice
        run: |
          node bin/toneline.js book -c examples/cross-timbers.json \
            -f examples/march-2024.feed -j /tmp/seal-a.json \
            -a 2024-03-14T08:00 -b ci | grep -o 'seals to [0-9a-f]*' > /tmp/seal-a.txt
          node bin/toneline.js book -c examples/cross-timbers.json \
            -f examples/march-2024.feed -j /tmp/seal-b.json \
            -a 2024-03-14T08:00 -b ci | grep -o 'seals to [0-9a-f]*' > /tmp/seal-b.txt
          diff /tmp/seal-a.txt /tmp/seal-b.txt
          test -s /tmp/seal-a.txt

      - name: the version on the command line matches the package
        run: |
          test "$(node bin/toneline.js --version)" = "$(node -p "require('./package.json').version")"

      - name: check what was written
        run: |
          test -s /tmp/postings.json
          test -s /tmp/register.csv
          test -s /tmp/desk.geojson
          test -s /tmp/journal.json
          head -1 /tmp/register.csv | grep -q '^ticket,type,status'
          # Read these rather than requiring them. The commonjs loader picks its
          # parser by file extension, so `require` on a .geojson file tries to
          # run it as javascript and dies on the first colon.
          node -e "
            const { readFileSync } = require('node:fs');
            const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
            const journal = read('/tmp/journal.json');
            const map = read('/tmp/desk.geojson');
            const postings = read('/tmp/postings.json');
            if (journal.tickets.length !== 4) throw new Error('journal holds ' + journal.tickets.length + ' tickets');
            if (!/^[0-9a-f]{64}$/.test(journal.auditHead)) throw new Error('journal carries no seal');
            if (map.type !== 'FeatureCollection') throw new Error('map is a ' + map.type);
            if (map.features.length < 10) throw new Error('map holds ' + map.features.length + ' features');
            if (postings.length < 4) throw new Error('only ' + postings.length + ' postings');
          "

      - name: run it twice and get the same answer
        run: |
          node bin/toneline.js screen -c examples/cross-timbers.json \
            -f examples/march-2024.feed > /tmp/first.txt
          node bin/toneline.js screen -c examples/cross-timbers.json \
            -f examples/march-2024.feed > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt

  image:
    name: build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t toneline:ci .
      - name: run the worked desk inside it
        run: |
          docker run --rm -v "$PWD/examples:/desk/examples:ro" toneline:ci \
            validate -c examples/cross-timbers.json --strict
